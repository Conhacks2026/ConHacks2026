spec:
  name: skylens
  region: nyc
  services:
    - name: skylens-api
      instance_count: 1
      instance_size_slug: basic-xxs
      dockerfile_path: Dockerfile.backend
      http_port: 8000
      routes:
        - path: /api
      envs:
        - key: GOOGLE_API_KEY
          scope: RUN_AND_BUILD_TIME
          type: SECRET
        - key: GEMINI_API_KEY
          scope: RUN_AND_BUILD_TIME
          type: SECRET
  static_sites:
    - name: skylens-ui
      build_command: npm run build
      output_dir: dist
      env_static_asset_path: /
      routes:
        - path: /
      envs:
        - key: VITE_API_URL
          scope: RUN_AND_BUILD_TIME
          value: ${skylens-api.PUBLIC_URL}/api
